[project]
name = "resumelens"
version = "0.1.0"
description = "Formal language-based resume screening for ICESI Integrative Task 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyformlang==1.0.11",
    "textX>=4.0.0",
    "pytest>=8.0.0",
    "graphviz>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
