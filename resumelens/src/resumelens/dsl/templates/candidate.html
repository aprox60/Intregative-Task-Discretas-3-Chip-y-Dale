<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ candidate_name }}</title>
  </head>
  <body>
    <h1>{{ candidate_name }}</h1>
    <p>Email: {{ email }}</p>
    <p>Phone: {{ phone }}</p>
    <h2>Skills</h2>
    <ul>
      {% for skill in skills %}
      <li>{{ skill }}</li>
      {% endfor %}
    </ul>
    <h2>Profile Results</h2>
    <ul>
      {% for profile_name, accepted in profile_results.items() %}
      <li>{{ profile_name }}: {{ accepted }}</li>
      {% endfor %}
    </ul>
  </body>
</html>
